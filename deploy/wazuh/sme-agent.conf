<!-- SME Wazuh agent profile. Tails the Sysmon channel and the common startup folder.
     Install the official Wazuh agent package from the vendor. This file is config only. -->
<ossec_config>
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <directories realtime="yes" check_all="yes">C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp</directories>
  </syscheck>
</ossec_config>
