AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub OIDC image publishing and namespace-scoped blakSOC deployment; no static AWS keys or cluster-admin access.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
Parameters:
  SubjectPrefix:
    Type: String
    Default: repo:yumaitau@165281358/blaksoc@1393930999
    Description: Exact immutable subject prefix reported by the repository OIDC settings API.
  ClusterName:
    Type: String
    Default: yumait-prod
Resources:
  PublishRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Publish the three application images using temporary GitHub OIDC credentials.
        must: [Trust only the production environment of this repository, No EKS or runtime secret access]
    Properties:
      RoleName: !Sub '${AWS::StackName}-publish'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub '${SubjectPrefix}:environment:production'
      Policies:
        - PolicyName: PublishBlaksocImages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/blaksoc-web'
                  - !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/blaksoc-worker'
                  - !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/blaksoc-hermes'
      Tags: [{ Key: App, Value: blaksoc }]
  DeployRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Discover this cluster and authenticate to the separately bootstrapped namespace Role.
        must: [No cluster administrator policy, No IAM or Secrets Manager privileges, Restrict GitHub production to main]
    Properties:
      RoleName: !Sub '${AWS::StackName}-deploy'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub '${SubjectPrefix}:environment:production'
      Policies:
        - PolicyName: DescribeProductionCluster
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}'
      Tags: [{ Key: App, Value: blaksoc }]
  DeployAccess:
    Type: AWS::EKS::AccessEntry
    Metadata:
      com.aws.cloudformation.Context:
        why: Map the deploy role to a Kubernetes group bound only within the blaksoc namespace.
        must: [Manage the Role and RoleBinding separately with an administrator, Do not associate a cluster-wide EKS access policy]
    Properties:
      ClusterName: !Ref ClusterName
      PrincipalArn: !GetAtt DeployRole.Arn
      Type: STANDARD
      KubernetesGroups: [blaksoc:github-deploy]
      Tags: [{ Key: App, Value: blaksoc }]
Outputs:
  PublishRoleArn:
    Value: !GetAtt PublishRole.Arn
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
