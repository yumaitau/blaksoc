# Bootstrap as a cluster administrator; this is deliberately outside the application Helm release.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deploy
  namespace: blaksoc
rules:
  # Helm release storage and the application's resources. No RBAC, exec, or cross-namespace access.
  - apiGroups: ['']
    resources: [configmaps, secrets, services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deploy
  namespace: blaksoc
subjects:
  - kind: Group
    name: blaksoc:github-deploy
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: github-deploy
  apiGroup: rbac.authorization.k8s.io
