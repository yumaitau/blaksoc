{{- if .Values.networkPolicy.enabled }}
{{- if and (not .Values.networkPolicy.dataStoresInCluster) (empty .Values.networkPolicy.egressCidrs) }}
{{- fail "networkPolicy.dataStoresInCluster is false: list the Postgres and Redis CIDRs in networkPolicy.egressCidrs, or web and worker cannot reach them" }}
{{- end }}
# Web accepts traffic only from the ingress controller; nothing may reach the worker.
# External scans run only on the worker (queue `surface`, job `scan`).
# Per tenant: 1 scan at a time, 6 hosts per minute (src/lib/asm/scan.ts SCAN_LIMITS).
# A scan starts only after an asm.attest audit row. Fixture mode opens no sockets.
# Egress for both: cluster-internal (including DNS), public TCP 443 when
# networkPolicy.publicHttps is true (private, metadata and loopback ranges excluded,
# so a misconfigured integration URL cannot reach internal services), and any CIDRs in
# networkPolicy.egressCidrs. Do not set egressCidrs to 0.0.0.0/0 or ::/0.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blaksoc.fullname" . }}-web
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }} } }
      ports: [{ port: 3000 }]
{{- include "blaksoc.egress" . }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blaksoc.fullname" . }}-worker
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker }
  policyTypes: [Ingress, Egress]
  ingress: []
{{- include "blaksoc.egress" . }}
{{- end }}
