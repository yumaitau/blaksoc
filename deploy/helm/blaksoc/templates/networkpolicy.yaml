{{- if .Values.networkPolicy.enabled }}
# Web accepts traffic only from the ingress controller; nothing may reach the worker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blaksoc.fullname" . }}-web
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
      ports: [{ port: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blaksoc.fullname" . }}-worker
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to: [{ namespaceSelector: {} }]
    - to:
      {{- range .Values.networkPolicy.egressCidrs }}
        - ipBlock: { cidr: {{ . }} }
      {{- end }}
{{- end }}
