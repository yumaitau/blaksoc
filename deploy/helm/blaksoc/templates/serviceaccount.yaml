{{- if .Values.serviceAccount.create }}
# Worker and backup pods. Annotate for IRSA, or bind with EKS Pod Identity, to reach the AU buckets without static keys.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "blaksoc.serviceAccountName" . }}
  labels: {{- include "blaksoc.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
