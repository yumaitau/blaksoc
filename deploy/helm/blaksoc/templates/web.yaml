apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blaksoc.fullname" . }}-web
  labels: {{- include "blaksoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: {{- include "blaksoc.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "blaksoc.image" (dict "root" . "target" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          env:
            {{- include "blaksoc.env" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          readinessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 30, failureThreshold: 5 }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts: [{ name: cache, mountPath: /app/.next/cache }, { name: tmp, mountPath: /tmp }]
      volumes: [{ name: cache, emptyDir: {} }, { name: tmp, emptyDir: {} }]
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "blaksoc.fullname" . }}-web
  labels: {{- include "blaksoc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "blaksoc.fullname" . }}-web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
{{- if .Values.web.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "blaksoc.fullname" . }}-web
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "blaksoc.fullname" . }}-web }
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.web.autoscaling.targetCPU }} } }
{{- end }}
