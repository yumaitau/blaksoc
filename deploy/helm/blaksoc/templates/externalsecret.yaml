{{- if .Values.externalSecret.enabled }}
# Builds .Values.existingSecret from a Secrets Manager entry through External Secrets.
# A pre-install hook so the secret exists before the migration job runs.
# The produced Secret is orphaned on hook re-creation, so running pods never lose it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.existingSecret }}
  labels: {{- include "blaksoc.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore.name }}
    kind: {{ .Values.externalSecret.secretStore.kind }}
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: Orphan
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteKey }}
{{- end }}
