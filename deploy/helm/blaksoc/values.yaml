image:
  repository: ghcr.io/yumaitau/blaksoc   # -web and -worker are appended; release.yml publishes both
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

appUrl: https://soc.example.com.au

# All secrets come from an existing Secret (sealed-secrets / external-secrets / Vault).
# Required keys: DATABASE_URL, DATABASE_SYSTEM_URL, DATABASE_ADMIN_URL, BLAKSOC_APP_DB_PASSWORD,
# BLAKSOC_SYSTEM_DB_PASSWORD, REDIS_URL, BETTER_AUTH_SECRET, BLAKSOC_ENCRYPTION_KEY.
# Only the migration job receives the whole Secret. Web and worker receive the keys listed in
# runtimeSecretKeys, so the owner URL and role passwords never reach a serving pod.
existingSecret: blaksoc
runtimeSecretKeys:
  required: [DATABASE_URL, DATABASE_SYSTEM_URL, REDIS_URL, BETTER_AUTH_SECRET, BLAKSOC_ENCRYPTION_KEY]
  optional:
    - ENTRA_TENANT_ID
    - ENTRA_CLIENT_ID
    - ENTRA_CLIENT_SECRET
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - GOOGLE_HOSTED_DOMAIN
    - ABR_GUID
    - M365_CONNECTOR_CLIENT_ID
    - M365_CONNECTOR_CLIENT_SECRET
    - SSO_TRUSTED_ORIGINS
    - BLAKSOC_SUPPLIER_ABN
    - WAZUH_MANAGER

# Optional: build existingSecret from AWS Secrets Manager (or another store) via External Secrets.
externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStore: { name: aws-secretsmanager, kind: ClusterSecretStore }
  remoteKey: ""

config:
  AI_DATA_RESIDENCY: AU
  # CIDRs of the proxies in front of blakSOC (ingress controller, load balancer, VPC). Client IPs for
  # sign-in rate limits and syslog allowlists are read from X-Forwarded-For past these. Empty trusts
  # only a single-entry header.
  TRUSTED_PROXY_CIDRS: ""
  OPENSEARCH_REGION: ap-southeast-2
  WAZUH_INDEXER_REGION: ap-southeast-2
  OPENCTI_REGION: ap-southeast-2
  BREAK_GLASS_REQUIRE_MFA: "true"
  # File-store fallback for the syslog archive when archive.s3.buckets is empty. The worker root is
  # read-only and this path is on the /tmp emptyDir, so objects DIE WITH THE POD. Dev only.
  BLAKSOC_ARCHIVE_DIR: /tmp/blaksoc-archive

# Durable syslog archive: AWS S3 or an S3-compatible store, Australian regions only. Set at least
# one bucket in production. Credentials come from the service account (IRSA / EKS Pod Identity) or
# optional existingSecret keys BLAKSOC_ARCHIVE_S3_ACCESS_KEY_ID and BLAKSOC_ARCHIVE_S3_SECRET_ACCESS_KEY.
archive:
  s3:
    buckets: {}            # e.g. { ap-southeast-2: blaksoc-archive-syd, ap-southeast-4: blaksoc-archive-mel }
    endpoint: ""           # S3-compatible endpoint (MinIO, an Australian provider); empty = AWS S3
    forcePathStyle: ""     # empty = path style when endpoint is set
    sse: AES256            # or aws:kms
    kmsKeyId: ""

# Worker and backup pods run as this account. Annotate it for IRSA, or bind it with EKS Pod Identity.
serviceAccount:
  create: false
  name: ""                 # empty = <release>-blaksoc when create is true, else the namespace default
  annotations: {}

# Logical Postgres backup (deploy/backup/pg-backup.sh): pg_dump -Fc with the owner URL from
# existingSecret (DATABASE_ADMIN_URL), uploaded with server-side encryption to an AU bucket.
# On RDS this is the second copy; automated backups and PITR are the first (docs/disaster-recovery.md).
backup:
  enabled: false
  schedule: "15 */6 * * *"   # every 6 hours: the logical-backup RPO
  bucket: ""
  region: ap-southeast-2     # ap-southeast-2 or ap-southeast-4; anything else fails the render
  prefix: postgres/
  keep: 28                   # dumps kept (7 days at 6-hourly); add a bucket lifecycle rule as backstop
  sse: AES256                # or aws:kms
  kmsKeyId: ""
  endpoint: ""               # S3-compatible endpoint; empty = AWS S3
  # pg_dump's major version must be >= the server's. Pin both images by digest in production.
  pgImage: postgres:16-alpine
  uploadImage: amazon/aws-cli:2.22.0
  activeDeadlineSeconds: 3600
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

web:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 8, targetCPU: 70 }

worker:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }

migrations:
  enabled: true
  seed: true   # reference data only unless DEMO_MODE=true

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # SSE live updates
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts: [soc.example.com.au]
  tls:
    - secretName: blaksoc-tls
      hosts: [soc.example.com.au]

# Processing and storage regions for the heavy data plane. Load and price were not measured.
dataPlane:
  opensearch: ap-southeast-2
  wazuhIndexer: ap-southeast-2
  opencti: ap-southeast-2

networkPolicy:
  enabled: true
  # Namespace of the ingress controller allowed to reach web.
  ingressNamespace: ingress-nginx
  # TCP 443 to public addresses for web and worker, with private, link-local (cloud metadata),
  # CGNAT and loopback ranges excluded. Needed for Entra sign-in, Microsoft Graph, CISA KEV,
  # FIRST EPSS, ACSC advisories, Kelpie, ABR and hosted AI providers. These services are not
  # region-pinned: which tenant data may reach them is enforced in the app by the data
  # governance profile. Set false for an air-gapped install and list exact CIDRs below instead.
  # Private or non-443 endpoints (self-hosted Ollama/vLLM, Wazuh API on 55000, SMTP relays) are
  # blocked unless their CIDRs are in egressCidrs.
  publicHttps: true
  # Postgres and Redis run as pods in this cluster. Set false when they are outside it (RDS,
  # ElastiCache, a VM): the chart then refuses to render until their CIDRs are in egressCidrs,
  # because both web and worker would otherwise lose their database.
  dataStoresInCluster: true
  # Extra egress CIDRs (any port), e.g. the VPC range of a managed Postgres or Redis outside the
  # cluster. 0.0.0.0/0 and ::/0 fail the hosting profile check.
  egressCidrs: []

# Logs, metrics, traces and alerting. See docs/observability.md.
observability:
  # debug | info | warn | error. Logs are JSON lines on stdout with secrets and raw payloads redacted.
  logLevel: info
  # OTLP/HTTP collector for traces, e.g. http://otel-collector.monitoring:4318. Empty: spans are not exported.
  otlpEndpoint: ""
  metrics:
    # Web and worker serve /metrics on this port. It is not on the web Service, so the ingress
    # never routes to it; the NetworkPolicy admits only scrapeNamespace.
    enabled: true
    port: 9464
    scrapeNamespace: monitoring
  # Prometheus Operator PodMonitor scraping web and worker pods (needs the monitoring.coreos.com CRDs).
  podMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # Prometheus Operator alert rules.
  prometheusRule:
    enabled: false
    labels: {}
    # Seconds without a scheduled job starting. Schedules tick every 30s; a stopped worker fires
    # within about 4 minutes with the default 1m rule evaluation.
    heartbeatStaleSeconds: 120
    queueBacklog: 200
    oldestJobAgeSeconds: 600
    jobFailureRatio: 0.2
    integrationFailingSeconds: 1800

podSecurityContext:
  runAsNonRoot: true
  # The image user `blaksoc` is 100:101. A numeric id lets the kubelet verify runAsNonRoot.
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
affinity: {}
