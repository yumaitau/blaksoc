name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: blaksoc
          POSTGRES_PASSWORD: blaksoc
          POSTGRES_DB: blaksoc
        ports:
          - 55471:5432
        options: >-
          --health-cmd "pg_isready -U blaksoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56471:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_URL: http://localhost:3107
      DATABASE_URL: postgres://blaksoc_app:change-me@localhost:55471/blaksoc
      DATABASE_SYSTEM_URL: postgres://blaksoc_system:change-me-too@localhost:55471/blaksoc
      DATABASE_ADMIN_URL: postgres://blaksoc:blaksoc@localhost:55471/blaksoc
      BLAKSOC_APP_DB_PASSWORD: change-me
      BLAKSOC_SYSTEM_DB_PASSWORD: change-me-too
      REDIS_URL: redis://localhost:56471
      BETTER_AUTH_SECRET: ci-only-secret-change-me-ci-only-secret
      BLAKSOC_ENCRYPTION_KEY: ZGV2LW9ubHkta2V5LWNoYW5nZS1tZS0zMi1ieXRlcyE=
      DEMO_MODE: "true"
      BREAK_GLASS_REQUIRE_MFA: "true"
      AI_DATA_RESIDENCY: AU
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm build:worker

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHART: deploy/helm/blaksoc
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      KUBERNETES_VERSION: 1.33.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - name: Lint, render and validate each values set
        run: |
          for overlay in "" values-k3s.yaml values-yumait-prod.yaml; do
            args=(-f "$CHART/values.yaml")
            [ -n "$overlay" ] && args+=(-f "$CHART/$overlay")
            echo "::group::values.yaml ${overlay}"
            helm lint --strict "$CHART" "${args[@]}"
            helm template blaksoc "$CHART" "${args[@]}" > rendered.yaml
            kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              rendered.yaml
            echo "::endgroup::"
          done

  # Hermes controller and toolset (hermes/): standard library only, so no install step.
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests (mocked blakSOC tuning API)
        run: python3 -m unittest discover -s hermes/tests -t hermes -v

  image:
    name: image (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: web, file: Dockerfile, user: "100:101" }
          - { target: worker, file: Dockerfile, user: "100:101" }
          - { target: hermes, file: hermes/Dockerfile, user: "10000:10000" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only: images are pushed by the release workflow.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: blaksoc-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Image runs as the numeric non-root user the chart expects
        env:
          EXPECTED_USER: ${{ matrix.user }}
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "blaksoc-${{ matrix.target }}:ci")"
          echo "image user: ${user}"
          [ "$user" = "$EXPECTED_USER" ]
      - name: Hermes image refuses to start without configuration
        if: matrix.target == 'hermes'
        run: |
          set +e
          docker run --rm --network none --read-only blaksoc-hermes:ci
          [ "$?" = "2" ]
      - name: Web image ships public/ (service worker, PWA icons)
        if: matrix.target == 'web'
        run: docker run --rm --entrypoint test blaksoc-web:ci -f public/sw.js
