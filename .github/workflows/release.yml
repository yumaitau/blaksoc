name: release

# Tag vX.Y.Z on main to publish ghcr.io/<owner>/blaksoc-{web,worker} as X.Y.Z and the 12-char commit
# SHA. Tags are never overwritten and no `latest` tag is pushed: deploy by version or digest.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: image (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing (Sigstore OIDC)
      security-events: write # Trivy SARIF to code scanning
    strategy:
      fail-fast: true
      matrix:
        target: [web, worker]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH[-pre]"; exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/blaksoc-${TARGET}"
          {
            echo "image=${image}"
            echo "version=${version}"
            echo "sha=${GITHUB_SHA::12}"
            echo "base=blaksoc-${TARGET}-${version}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a published tag
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          for tag in "$VERSION" "$SHA"; do
            if docker buildx imagetools inspect "${IMAGE}:${tag}" >/dev/null 2>&1; then
              echo "::error::${IMAGE}:${tag} already exists; tags are immutable, cut a new version"; exit 1
            fi
          done

      # Build into the local daemon first so the scan gates the push.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: blaksoc-${{ matrix.target }}:scan
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Trivy scan (SARIF, all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: blaksoc-${{ matrix.target }}:scan
          format: sarif
          output: trivy-${{ steps.meta.outputs.base }}.sarif
          exit-code: "0"
      - name: Trivy scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          image-ref: blaksoc-${{ matrix.target }}:scan
          format: table
          output: trivy-${{ steps.meta.outputs.base }}.txt
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-${{ steps.meta.outputs.base }}.sarif
          category: trivy-${{ matrix.target }}
      - name: Trivy gate (fail on fixable critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          image-ref: blaksoc-${{ matrix.target }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          provenance: mode=max
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.title=blaksoc-${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ steps.meta.outputs.base }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ steps.meta.outputs.base }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image and attest SBOMs (keyless)
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          BASE: ${{ steps.meta.outputs.base }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate "${BASE}.spdx.json" "$REF"
          cosign attest --yes --type cyclonedx --predicate "${BASE}.cdx.json" "$REF"
          echo "$REF" > "${BASE}.digest"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ steps.meta.outputs.base }}.spdx.json
            ${{ steps.meta.outputs.base }}.cdx.json
            ${{ steps.meta.outputs.base }}.digest
            trivy-${{ steps.meta.outputs.base }}.sarif
            trivy-${{ steps.meta.outputs.base }}.txt

  release:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release and upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release with SBOMs and scan reports
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Images"
            echo
            for f in dist/*.digest; do echo "- \`$(cat "$f")\`"; done
            echo
            echo "Verify a signature:"
            echo
            echo '```sh'
            echo "cosign verify --certificate-identity-regexp '^https://github.com/${GH_REPO}/.github/workflows/release.yml@refs/tags/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com <image>@<digest>"
            echo '```'
          } > notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
